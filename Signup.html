<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eBuy - Create Account</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <div class="maincard">
      <div class="row g-0">
        <div class="col-md-5 d-none d-md-block">
          <div class="bannerstyle">
            <div
              id="authslide"
              class="carousel slide carousel-fade"
              data-bs-ride="carousel"
              data-bs-interval="5000"
            >
              <div class="carousel-indicators">
                <button
                  type="button"
                  data-bs-target="#authslide"
                  data-bs-slide-to="0"
                  class="active"
                  aria-current="true"
                ></button>
                <button
                  type="button"
                  data-bs-target="#authslide"
                  data-bs-slide-to="1"
                ></button>
                <button
                  type="button"
                  data-bs-target="#authslide"
                  data-bs-slide-to="2"
                ></button>
              </div>
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img
                    src="https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=800"
                    class="d-block w-100"
                    alt="Shopping 1"
                  />
                  <div class="bannercaption">
                    <h3>Discover Latest<br />Fashion Trends</h3>
                  </div>
                </div>
                <div class="carousel-item">
                  <img
                    src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?q=80&w=800"
                    class="d-block w-100"
                    alt="Shopping 2"
                  />
                  <div class="bannercaption">
                    <h3>Exclusive Deals &<br />Big Savings</h3>
                  </div>
                </div>
                <div class="carousel-item">
                  <img
                    src="https://images.unsplash.com/photo-1472851294608-062f824d29cc?q=80&w=800"
                    class="d-block w-100"
                    alt="Shopping 3"
                  />
                  <div class="bannercaption">
                    <h3>Easy Online<br />Shopping Experience</h3>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-7">
          <div class="formsection">
            <div class="formtitle">Create an account</div>
            <div class="formsubtitle">
              Already have an account? <a href="index.html">Log in</a>
            </div>
            <form id="registerform">
              <div class="mb-3">
                <input
                  type="text"
                  id="regUser"
                  class="form-control"
                  placeholder="Username"
                  required
                  maxlength="25"
                />
              </div>
              <div class="mb-3">
                <input
                  type="email"
                  id="regEmail"
                  class="form-control"
                  placeholder="Email"
                  required
                />
              </div>
              <div class="mb-3">
                <input
                  type="password"
                  id="regPass"
                  class="form-control"
                  placeholder="Enter your password"
                  minlength="6"
                  required
                />
              </div>
              <div class="form-check mb-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="termscheck"
                  required
                  checked
                />
                <label class="form-check-label" for="termscheck">
                  I agree to the <a href="#">Terms & Conditions</a>
                </label>
              </div>
              <button type="submit" class="btnsubmit">Create account</button>
              <p
                class="small mt-3 mb-0"
                id="registerMessage"
                role="status"
                aria-live="polite"
              ></p>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
      document
        .getElementById("registerform")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const username = document.getElementById("regUser").value.trim();
          const email = document.getElementById("regEmail").value.trim();
          const password = document.getElementById("regPass").value;
          const normalizedUsername = window.eBuyAccounts.normalize(username);
          const normalizedEmail = window.eBuyAccounts.normalize(email);
          const users = window.eBuyAccounts.readUsers();
          const message = document.getElementById("registerMessage");
          if (normalizedUsername === "admin") {
            message.className = "small mt-3 mb-0 text-danger";
            message.textContent = "That username is reserved.";
            document.getElementById("regUser").focus();
            return;
          }

          const usernameExists = users.some(
            (user) =>
              window.eBuyAccounts.normalize(user.username) ===
              normalizedUsername,
          );
          if (usernameExists) {
            message.className = "small mt-3 mb-0 text-danger";
            message.textContent = "That username is already registered.";
            document.getElementById("regUser").focus();
            return;
          }

          const emailExists = users.some(
            (user) =>
              window.eBuyAccounts.normalize(user.email) === normalizedEmail,
          );
          if (emailExists) {
            message.className = "small mt-3 mb-0 text-danger";
            message.textContent = "That email is already registered.";
            document.getElementById("regEmail").focus();
            return;
          }

          const userData = {
            username: username,
            displayName: username,
            email: email,
            password: password,
          };

          window.eBuyAccounts.saveUser(userData);

          alert(
            "Đăng ký tài khoản thành công! Chuyển hướng đến trang đăng nhập.",
          );
          window.location.href = "index.html";
        });
    </script>
  </body>
</html>
