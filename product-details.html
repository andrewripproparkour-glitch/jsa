<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - eBuy</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="home.css" />
    <style>
      .maincontent {
        padding-top: 100px;
        padding-bottom: 48px;
      }
      .product-image {
        width: 100%;
        height: 390px;
        object-fit: cover;
      }
      .product-id {
        font-size: 0.8rem;
        word-break: break-all;
      }
      .star-btn {
        cursor: pointer;
      }
      .review-photo {
        max-height: 280px;
        max-width: min(100%, 420px);
        object-fit: contain;
      }
      .empty-state {
        min-height: 260px;
      }
      @media (max-width: 767.98px) {
        .product-image {
          height: 280px;
        }
        .product-actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-xl topnavbar fixed-top">
      <div class="container">
        <a class="navbar-brand brandlogo" href="home.html">eBuy</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navmenu"
          aria-controls="navmenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navmenu">
          <ul class="navbar-nav me-3">
            <li class="nav-item">
              <a class="nav-link" href="home.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="profile.html">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="group.html">Groups</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-marketplace" href="#">Marketplace</a>
            </li>
          </ul>
          <div class="userprofile ms-lg-3">
            <span>Welcome, <strong id="displayuser">User</strong></span>
            <a href="index.html" id="btnlogout" class="btnlogout">Log out</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="maincontent container">
      <div id="productView">
        <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 mb-4">
          <div class="row g-4 align-items-center">
            <div class="col-md-5">
              <div class="position-relative overflow-hidden rounded-4">
                <img id="productImage" class="product-image" src="" alt="" />
                <span
                  id="productBadge"
                  class="badge bg-danger position-absolute top-0 start-0 m-3 px-3 py-2 rounded-pill"
                ></span>
              </div>
            </div>
            <div class="col-md-7">
              <div
                class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2"
              >
                <span
                  id="productCategory"
                  class="badge text-bg-light border"
                ></span>
              </div>
              <h1 id="productName" class="h2 fw-bold mb-2"></h1>
              <p id="productDescription" class="text-muted mb-3"></p>
              <div class="d-flex align-items-center mb-3">
                <span class="text-warning me-2" aria-label="5 out of 5 stars">
                  <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i
                  ><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i
                  ><i class="bi bi-star-half"></i>
                </span>
                <span class="text-muted small"
                  >(<span id="reviewCount">0</span> Reviews)</span
                >
              </div>
              <div class="mb-4">
                <span
                  id="productPrice"
                  class="fs-2 fw-bold text-danger me-3"
                ></span>
                <span
                  id="productOldPrice"
                  class="fs-5 text-muted text-decoration-line-through"
                ></span>
              </div>
              <div class="d-flex align-items-center mb-4">
                <label class="fw-semibold me-3" for="buyQty">Quantity:</label>
                <div class="input-group" style="width: 140px">
                  <button
                    class="btn btn-outline-secondary"
                    type="button"
                    id="btnMinus"
                    aria-label="Decrease quantity"
                  >
                    -
                  </button>
                  <input
                    type="number"
                    id="buyQty"
                    class="form-control text-center"
                    value="1"
                    min="1"
                    max="99"
                  />
                  <button
                    class="btn btn-outline-secondary"
                    type="button"
                    id="btnPlus"
                    aria-label="Increase quantity"
                  >
                    +
                  </button>
                </div>
              </div>
              <div class="d-flex gap-3 product-actions">
                <button
                  class="btn btn-primary btn-lg flex-grow-1 rounded-3"
                  id="addToCartButton"
                  type="button"
                >
                  <i class="bi bi-cart-plus me-2"></i>Add to Cart
                </button>
                <button
                  class="btn btn-danger btn-lg flex-grow-1 rounded-3"
                  id="buyNowButton"
                  type="button"
                >
                  <i class="bi bi-bag-check me-2"></i>Buy Now
                </button>
              </div>
              <div
                id="cartMessage"
                class="small text-success mt-3"
                role="status"
                aria-live="polite"
              ></div>
            </div>
          </div>
        </div>

        <section
          class="card border-0 shadow-sm rounded-4 p-3 p-md-4"
          aria-labelledby="reviewsHeading"
        >
          <h2 id="reviewsHeading" class="h4 fw-bold mb-4">
            <i class="bi bi-chat-square-quote me-2 text-primary"></i>Customer
            Reviews
          </h2>
          <div class="card bg-light border-0 rounded-4 p-3 p-md-4 mb-4">
            <h3 class="h6 fw-bold mb-3">Write Your Review</h3>
            <form id="reviewForm">
              <div class="mb-3 d-flex flex-wrap align-items-center gap-3">
                <label class="form-label mb-0 fw-semibold">Your Rating:</label>
                <div
                  class="star-rating text-warning fs-3"
                  id="ratingContainer"
                  aria-label="Choose a rating from 1 to 5"
                >
                  <i
                    class="bi bi-star-fill star-btn"
                    data-value="1"
                    role="button"
                    tabindex="0"
                    aria-label="1 star"
                  ></i>
                  <i
                    class="bi bi-star-fill star-btn"
                    data-value="2"
                    role="button"
                    tabindex="0"
                    aria-label="2 stars"
                  ></i>
                  <i
                    class="bi bi-star-fill star-btn"
                    data-value="3"
                    role="button"
                    tabindex="0"
                    aria-label="3 stars"
                  ></i>
                  <i
                    class="bi bi-star-fill star-btn"
                    data-value="4"
                    role="button"
                    tabindex="0"
                    aria-label="4 stars"
                  ></i>
                  <i
                    class="bi bi-star-fill star-btn"
                    data-value="5"
                    role="button"
                    tabindex="0"
                    aria-label="5 stars"
                  ></i>
                </div>
                <span
                  class="badge bg-warning text-dark fs-6 rounded-pill"
                  id="ratingLabel"
                  >5 / 5 Stars</span
                >
              </div>
              <div class="mb-3">
                <textarea
                  id="reviewText"
                  class="form-control"
                  rows="3"
                  placeholder="Share your feedback about this product..."
                  required
                ></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold" for="reviewImageUrl">
                  Photo URL (optional)
                </label>
                <input
                  id="reviewImageUrl"
                  class="form-control"
                  type="url"
                  placeholder="https://example.com/photo.jpg"
                  autocomplete="url"
                />
              </div>
              <p
                id="reviewFormMessage"
                class="small text-danger mb-3"
                role="status"
                aria-live="polite"
              ></p>
              <button type="submit" class="btn btn-primary px-4 rounded-3">
                Submit Review
              </button>
            </form>
          </div>
          <div id="reviewsList" class="d-flex flex-column gap-3"></div>
        </section>
      </div>

      <section
        id="emptyState"
        class="card border-0 shadow-sm rounded-4 empty-state d-none align-items-center justify-content-center text-center p-4"
      >
        <i class="bi bi-box-seam display-4 text-secondary mb-3"></i>
        <h1 class="h4 fw-bold">Product not found</h1>
        <p class="text-muted mb-3">
          No product matches this ID in your saved product list.
        </p>
        <a class="btn btn-primary" href="sanpham1.html">Browse products</a>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const PRODUCTS_KEY = "eBuyProducts";
      const CART_KEY = "eBuyCart";
      const DEMO_PRODUCT = {
        id: "ebuy-headphones-001",
        name: "Wireless Headphones",
        category: "Electronics",
        description:
          "Enjoy clear, balanced sound and comfortable listening throughout your day.",
        price: 99,
        oldPrice: 129,
        image:
          "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=1000",
        badge: "Sale -23%",
      };

      function readJson(key, fallback) {
        try {
          const value = JSON.parse(localStorage.getItem(key));
          return value ?? fallback;
        } catch {
          return fallback;
        }
      }

      function getProducts() {
        const products = readJson(PRODUCTS_KEY, null);
        const savedProducts = Array.isArray(products)
          ? products
          : [DEMO_PRODUCT];
        if (!Array.isArray(products)) {
          localStorage.setItem(PRODUCTS_KEY, JSON.stringify(savedProducts));
        }
        const legacyMarketplaceProducts = readJson("ebuy_products", []);
        const sellerProducts = readJson("eBuyUserProducts", []);
        const allProducts = [
          ...savedProducts,
          ...(Array.isArray(legacyMarketplaceProducts)
            ? legacyMarketplaceProducts.map((product) => ({
                ...product,
                name: product.name || product.title,
                image: product.image || product.img,
              }))
            : []),
          ...(Array.isArray(sellerProducts)
            ? sellerProducts.filter((product) => product.status === "approved")
            : []),
        ];
        const productsById = new Map();
        allProducts.forEach((product) => {
          if (product?.id == null) return;
          const id = String(product.id);
          if (!productsById.has(id)) productsById.set(id, { ...product, id });
        });
        return [...productsById.values()];
      }

      function getProductId() {
        return (
          new URLSearchParams(window.location.search).get("id") ||
          DEMO_PRODUCT.id
        );
      }

      function renderProduct(product) {
        document.title = `${product.name} - eBuy`;
        document.getElementById("productImage").src = product.image;
        document.getElementById("productImage").alt = product.name;
        document.getElementById("productName").textContent = product.name;
        document.getElementById("productDescription").textContent =
          product.description || "No description available.";
        document.getElementById("productCategory").textContent =
          product.category || "General";
        document.getElementById("productPrice").textContent =
          `$${Number(product.price).toFixed(2)}`;
        document.getElementById("productOldPrice").textContent =
          product.oldPrice ? `$${Number(product.oldPrice).toFixed(2)}` : "";
        document.getElementById("productBadge").textContent =
          product.badge || "Available";
      }

      function getStoredReviews() {
        return readJson(`eBuyReviews_${getProductId()}`, []);
      }

      function saveStoredReviews(reviews) {
        localStorage.setItem(
          `eBuyReviews_${getProductId()}`,
          JSON.stringify(reviews),
        );
      }

      function isHttpUrl(value) {
        try {
          return ["http:", "https:"].includes(new URL(value).protocol);
        } catch {
          return false;
        }
      }

      function renderReviewItem(item) {
        const review = document.createElement("article");
        review.className = "card border-0 bg-light p-3 rounded-3";
        const stars = Array.from(
          { length: 5 },
          (_, index) =>
            `<i class="bi ${index < item.rating ? "bi-star-fill" : "bi-star"} me-1"></i>`,
        ).join("");
        review.innerHTML = `
          <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
            <div><strong class="text-dark me-2"></strong><span class="text-warning fs-6">${stars}</span></div>
            <button class="btn btn-outline-danger btn-sm rounded-3 delete-btn" type="button" aria-label="Delete review"><i class="bi bi-trash"></i></button>
          </div>
          <p class="text-muted mb-0"></p>`;
        review.querySelector("strong").textContent = item.username;
        review.querySelector("p").textContent = item.content;
        if (item.imageUrl && isHttpUrl(item.imageUrl)) {
          const image = document.createElement("img");
          image.src = item.imageUrl;
          image.alt = `Photo attached by ${item.username || "User"}`;
          image.className = "review-photo img-fluid rounded mt-3";
          review.appendChild(image);
        }
        review.querySelector(".delete-btn").addEventListener("click", () => {
          saveStoredReviews(
            getStoredReviews().filter(
              (savedReview) => savedReview.id !== item.id,
            ),
          );
          loadReviews();
        });
        return review;
      }

      function loadReviews() {
        const reviews = getStoredReviews();
        const list = document.getElementById("reviewsList");
        list.replaceChildren(...reviews.map(renderReviewItem));
        document.getElementById("reviewCount").textContent = reviews.length;
      }

      const products = getProducts();
      const currentProduct = products.find(
        (product) => String(product.id) === getProductId(),
      );
      if (currentProduct) {
        renderProduct(currentProduct);
        loadReviews();
      } else {
        document.getElementById("productView").classList.add("d-none");
        document.getElementById("emptyState").classList.remove("d-none");
        document.getElementById("emptyState").classList.add("d-flex");
      }

      const savedUser = localStorage.getItem("currentuser");
      if (savedUser)
        document.getElementById("displayuser").textContent = savedUser;
      document.getElementById("btnlogout").addEventListener("click", () => {
        localStorage.removeItem("currentuser");
        localStorage.removeItem("currentrole");
        localStorage.removeItem("currentdisplayname");
      });

      const quantityInput = document.getElementById("buyQty");
      document.getElementById("btnMinus").addEventListener("click", () => {
        quantityInput.value = Math.max(1, Number(quantityInput.value) - 1);
      });
      document.getElementById("btnPlus").addEventListener("click", () => {
        quantityInput.value = Math.min(99, Number(quantityInput.value) + 1);
      });

      document
        .getElementById("addToCartButton")
        .addEventListener("click", () => {
          if (!currentProduct) return;
          const cart = readJson(CART_KEY, []);
          const cartItem = cart.find(
            (item) => item.productId === currentProduct.id,
          );
          if (cartItem) cartItem.quantity += Number(quantityInput.value);
          else
            cart.push({
              productId: currentProduct.id,
              quantity: Number(quantityInput.value),
            });
          localStorage.setItem(CART_KEY, JSON.stringify(cart));
          document.getElementById("cartMessage").textContent =
            `${currentProduct.name} added to your saved cart.`;
        });

      document.getElementById("buyNowButton").addEventListener("click", () => {
        if (!currentProduct) return;
        const total =
          Number(currentProduct.price) * Number(quantityInput.value);
        alert(
          `Proceeding to checkout ${quantityInput.value} ${currentProduct.name}. Total: $${total.toFixed(2)}`,
        );
      });

      let selectedRating = 5;
      const stars = document.querySelectorAll(".star-btn");
      const ratingLabel = document.getElementById("ratingLabel");

      function renderStars(rating) {
        stars.forEach((star, index) => {
          star.classList.toggle("bi-star-fill", index < rating);
          star.classList.toggle("bi-star", index >= rating);
        });
        ratingLabel.textContent = `${rating} / 5 Stars`;
      }

      stars.forEach((star) => {
        const chooseRating = () => {
          selectedRating = Number(star.dataset.value);
          renderStars(selectedRating);
        };
        star.addEventListener("mouseover", () =>
          renderStars(Number(star.dataset.value)),
        );
        star.addEventListener("mouseout", () => renderStars(selectedRating));
        star.addEventListener("click", chooseRating);
        star.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") chooseRating();
        });
      });

      document
        .getElementById("reviewForm")
        .addEventListener("submit", (event) => {
          event.preventDefault();
          if (!currentProduct) return;
          const content = document.getElementById("reviewText").value.trim();
          const imageUrl = document
            .getElementById("reviewImageUrl")
            .value.trim();
          if (!content) return;
          const message = document.getElementById("reviewFormMessage");
          if (imageUrl && !isHttpUrl(imageUrl)) {
            message.textContent = "Enter a valid http or https photo URL.";
            return;
          }
          const reviews = getStoredReviews();
          reviews.unshift({
            id:
              globalThis.crypto?.randomUUID?.() ||
              `${Date.now()}-${Math.random().toString(16).slice(2)}`,
            username: localStorage.getItem("currentuser") || "User",
            rating: selectedRating,
            content,
            imageUrl,
          });
          saveStoredReviews(reviews);
          loadReviews();
          event.target.reset();
          message.textContent = "";
          selectedRating = 5;
          renderStars(selectedRating);
        });
    </script>
  </body>
</html>
